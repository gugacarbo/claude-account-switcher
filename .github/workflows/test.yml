name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - run: bun run validate:ci
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frontend checks
        run: bun install --frozen-lockfile && bun run validate
      - run: go vet -tags headless ./...
      - run: go test -tags headless ./...
      - name: Desktop compile
        run: go build -tags "purego production" -o desktop-check ./cmd/claude-account-switcher
      - name: Native desktop bridge smoke
        if: runner.os != 'Linux'
        run: go test -tags "purego production desktop_smoke" -run TestDesktopBridgeSmoke -count=1 -timeout 60s ./internal/app
